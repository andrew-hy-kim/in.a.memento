<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description | strip_newlines | strip }}">
  <meta property="og:title" content="{{ page.title | default: site.title }}">
  <meta property="og:description" content="{{ page.description | default: site.description | strip_newlines | strip }}">
  <meta property="og:type" content="website">
  <meta name="theme-color" content="#fffaf1">
  <link rel="icon" href="{{ '/images/favicon.svg' | relative_url }}" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  {%- comment -%} ?v= changes on every deploy so browsers never pair a new page with an old stylesheet {%- endcomment -%}
  {%- assign v = site.time | date: '%s' %}
  <link rel="stylesheet" href="{{ '/css/style.css' | relative_url }}?v={{ v }}">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  {% include header.html %}
  <main id="main">
    {{ content }}
  </main>
  {% include footer.html %}
  <script src="{{ '/js/main.js' | relative_url }}?v={{ v }}"></script>
</body>
</html>

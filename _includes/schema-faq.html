<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "FAQPage",
  "mainEntity": [
    {%- for item in site.data.faq %}
    { "@type": "Question", "name": {{ item.q | jsonify }}, "acceptedAnswer": { "@type": "Answer", "text": {{ item.a | strip_html | jsonify }} } }{% unless forloop.last %},{% endunless %}
    {%- endfor %}
  ]
}
</script>

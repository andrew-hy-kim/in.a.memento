{%- assign questions = "" | split: "" %}
{%- for group in site.data.faq %}{% assign questions = questions | concat: group.items %}{% endfor -%}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "FAQPage",
  "mainEntity": [
    {%- for item in questions %}
    { "@type": "Question", "name": {{ item.q | jsonify }}, "acceptedAnswer": { "@type": "Answer", "text": {{ item.a | markdownify | strip_html | normalize_whitespace | strip | jsonify }} } }{% unless forloop.last %},{% endunless %}
    {%- endfor %}
  ]
}
</script>

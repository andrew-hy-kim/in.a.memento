{%- assign nav = "Home|/,How It Works|/#how-it-works,Pricing|/pricing/,Gallery|/gallery/,FAQ|/faq/" | split: "," -%}
<header class="site-header">
  <div class="container">
    <a class="logo" href="{{ '/' | relative_url }}" aria-label="in a memento home">
      <span class="logo-badge" aria-hidden="true">in a<br>memento</span>
      <span class="logo-word">in a memento</span>
    </a>
    <button class="nav-toggle" aria-expanded="false" aria-controls="nav-links">Menu ☰</button>
    <ul class="nav-links" id="nav-links">
      {%- for item in nav -%}
        {%- assign parts = item | split: "|" -%}
        <li><a href="{{ parts[1] | relative_url }}"{% if page.url == parts[1] %} aria-current="page"{% endif %}>{{ parts[0] }}</a></li>
      {%- endfor -%}
      <li><a class="nav-cta" href="{{ '/contact/' | relative_url }}"{% if page.url == '/contact/' %} aria-current="page"{% endif %}>Book Us</a></li>
    </ul>
  </div>
</header>

# Site settings: GitHub Pages builds this automatically with Jekyll.
title: in a memento
tagline: Vending Machine Rentals in Seattle   # shown after the name in the home page's Google title
description: >-
  Sticker, temporary tattoo and/or mini print vending machine rentals for weddings, parties
  and events in Seattle, WA. Personalized favors your guests get to pull themselves.
url: "https://inamemento.com"
baseurl: ""   # blank because the site is served from the domain root (inamemento.com)

instagram: https://www.instagram.com/in.a.memento/
inquiry_form: https://docs.google.com/forms/d/e/1FAIpQLSe85VIphF1qTB14P-bY9GlTR199mvtphi0w0MrX4nMlo8ekOQ/viewform
location: Seattle, WA

# Search engine settings (used by jekyll-seo-tag and jekyll-sitemap, both built into GitHub Pages)
lang: en_US
logo: /images/logo.png
twitter:
  card: summary_large_image
social:
  name: in a memento
  links:
    - https://www.instagram.com/in.a.memento/

defaults:
  - scope: { path: "" }
    values:
      image: /images/share.jpg   # default link preview picture for texts and social posts

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

exclude:
  - README.md
  - extras

# Design library: used by the Designs page, the Gallery teaser and the "pull a memento" machine on the home page.
# image      = file name in images/designs/ (without .webp)
# name       = short label; not shown on the site, but used to keep track of designs (and in the weekly Drive check)
# alt        = description for screen readers and Google
# collection = which shelf it sits on, on the Designs page (see _data/collections.yml for the list)
# added      = the date it went on the site (YYYY-MM-DD); the newest 8 from the last 30 days also show under "New"
# Within a collection, designs show in the order they appear here.


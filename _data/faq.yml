# Questions for the FAQ page, grouped into sections (also used for Google's FAQ rich results).
# Answers are written in Markdown: **bold**, [link text](/pricing/), and "- " bullet lists all work.

- group: "The basics"
  id: basics
  icon: "🪙"
  items:
    - q: "What kinds of events do you do?"
      a: "Weddings, birthday parties, bridal showers, baby showers, corporate events and social gatherings. If there are people who'd enjoy a surprise, we'd love to be there!"

    - q: "What goes in the machine?"
      a: |
        Stickers, temporary tattoos and/or mini prints! The machine has three slots, so each one can hold something different, and you can mix and match.

        - **Mini prints** are a beautiful, permanent keepsake.
        - **Stickers** are a universal crowd pleaser.
        - **Temporary tattoos** add an interactive vibe to the reception!

    - q: "Are the temporary tattoos safe for skin?"
      a: "Yes, our temporary tattoos are safe for skin and come off with soap and water or a little baby oil."

- group: "Designs & customization"
  id: designs
  icon: "🎨"
  items:
    - q: "Can we customize the designs or use our own artwork?"
      a: |
        Yes! You have three options:

        - **Choose from our design library.** Customizing these is free.
        - **Provide your own art, for free.** We love using your custom wedding crests, monograms, venue line drawings, or photos of your pets. Simply upload your high resolution files during the booking process, and we’ll handle the sizing, printing, and packaging.
        - **Request a custom design** for $50 each. We’d love to hear your vision and create artwork based on your wedding or event aesthetic. A color palette is a great way to keep your pieces cohesive.

    - q: "Are the artworks AI generated?"
      a: "No! All designs are made either by us or a local Seattle artist, created specifically for your event."

- group: "Pricing & travel"
  id: pricing
  icon: "🏷️"
  items:
    - q: "How much does it cost?"
      a: |
        Machine rental is $200 for 2 hours up to $425 for 5 hours, including delivery, setup and pickup. Mementos are $0.50–$2 per item depending on the type, quantity and size. Please see our [pricing page](/pricing/) for details.

        Planning a corporate event? Please reach out through our [booking inquiry](/contact/) for corporate pricing.

    - q: "Where are you located? Do you travel?"
      a: "We're based in Capitol Hill, Seattle. Travel is free within 25 miles. Beyond that, it's $2.50 per mile for each mile past the first 25, using the Google Maps driving distance (one way) from Capitol Hill to your venue. For example, a venue 45 miles away adds $50. For venues over 100 miles away we'll quote you directly, and overnight accommodation may need to be covered."

- group: "Booking & event day"
  id: booking
  icon: "📅"
  items:
    - q: "How far in advance should we book?"
      a: "As soon as possible! To ensure ample time for custom designs and printing, we request a minimum of 2 months’ notice. If your event is sooner, please [reach out](/contact/) and we’ll see what we can do! For expedited production within 3 weeks, a $75 fee will be added to cover priority printing and expedited shipping."

    - q: "How do we book, and what happens next?"
      a: |
        Please fill out our [interest form](/contact/) and we'll email you about availability within 1 to 5 business days. A 25% deposit secures your date.

        After you book, we will meet virtually over phone or video call to go over all the details, including your vision for your mementos, the signage, timeline, and any questions you may have. We’ll then work together to make your designs perfect and ready for your event!

    - q: "What is your payment policy?"
      a: "A minimum 25% deposit is due at booking to secure your date, and deposits are non-refundable. The remaining balance is due in full at least 14 days before your event."

    - q: "What happens on the day of the event?"
      a: "We deliver and set up the machine, keep an eye on it during your event, and take it away afterward. We provide tokens for your guests, so no one needs to bring coins."

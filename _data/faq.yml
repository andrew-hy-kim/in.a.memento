# Questions for the FAQ page (also used for Google's FAQ rich results).
# Answers can include simple HTML like links.

- q: "What kinds of events do you do?"
  a: "Weddings, birthday parties, bridal showers, baby showers, corporate events and social gatherings. If there are people who'd enjoy a surprise, we'd love to be there!"

- q: "What goes in the machine?"
  a: "Stickers, temporary tattoos and/or mini prints! The machine has three slots, so each one can hold something different."

- q: "Prints, stickers, or tattoos?"
  a: "Mini prints are a beautiful, permanent keepsake. Stickers are a universal crowd pleaser. Temporary tattoos add an interactive vibe to the reception! You can also mix and match."

- q: "Can we customize the designs?"
  a: "Yes! Choose from our design library (customizing those is free), provide your own art for free, or request a custom design for $50 each."

- q: "Can I use my own artwork or wedding logo?"
  a: "Yes! We love using your custom wedding crests, monograms, venue line drawings, or photos of your pets. Simply upload your high resolution files during the booking process, and we’ll handle the sizing, printing, and packaging."

- q: "Can we request custom themes or colors?"
  a: "Yes, of course! We’d love to hear your vision and create artwork based on your wedding or event aesthetic. A color palette is a great way to keep your pieces cohesive."

- q: "Are the artworks AI generated?"
  a: "No! All designs are made either by us or a local Seattle artist, created specifically for your event."

- q: "How much does it cost?"
  a: "Machine rental is $200 for 2 hours up to $425 for 5 hours, including delivery, setup and pickup. Mementos are $0.50–$2 per item depending on the type, quantity and size. Please see our <a href=\"/pricing/\">pricing page</a> for details."

- q: "Do guests need to bring coins?"
  a: "Nope! We provide tokens for your guests."

- q: "Are the temporary tattoos safe for skin?"
  a: "Yes, our temporary tattoos are safe for skin and come off with soap and water or a little baby oil."

- q: "Where are you located? Do you travel?"
  a: "We're based in Capitol Hill, Seattle. Travel is free within 25 miles. Beyond that, it's $2.50 per mile for each mile past the first 25, using the Google Maps driving distance (one way) from Capitol Hill to your venue. For example, a venue 45 miles away adds $50. For venues over 100 miles away we'll quote you directly, and overnight accommodation may need to be covered."

- q: "Do you stay during the event?"
  a: "Yes. We set up the machine, keep an eye on it during your event, and take it away afterward."

- q: "How far in advance should we book?"
  a: "As soon as possible! To ensure ample time for custom designs and printing, we request a minimum of 2 months’ notice. If your event is sooner, please <a href=\"/contact/\">reach out</a> and we’ll see what we can do! For expedited production within 3 weeks, a $75 fee will be added to cover priority printing and expedited shipping."

- q: "How do we book?"
  a: "Please fill out our <a href=\"/contact/\">interest form</a> and we'll email you about availability within 1 to 5 business days. A 25% deposit secures your date."

- q: "What is the process like after I book?"
  a: "We will meet virtually over phone or video call to go over all the details, including your vision for your prints, the signage, timeline, and any questions you may have. We’ll then work together to make your designs perfect and ready for your event!"

- q: "What is your payment policy?"
  a: "A minimum 25% deposit is due at booking to secure your date, and deposits are non-refundable. The remaining balance is due in full at least 14 days before your event."

- q: "Do you offer corporate pricing?"
  a: "Yes! Please reach out through our <a href=\"/contact/\">booking inquiry</a> for corporate pricing."

